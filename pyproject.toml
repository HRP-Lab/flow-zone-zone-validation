[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flowzone-validation"
version = "0.1.0"
description = "Cognitive feature and clustering pipeline for Flow Zone validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hdbscan>=0.8.40",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]
